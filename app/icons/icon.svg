          stroke-linecap="round" stroke-dasharray="660 943" transform="rotate(-90 256 256)"/>
  <!-- Zeiger -->
  <line x1="256" y1="256" x2="256" y2="168" stroke="#f4f1ea" stroke-width="28" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="318" y2="256" stroke="#f4f1ea" stroke-width="28" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="20" fill="#f4f1ea"/>
