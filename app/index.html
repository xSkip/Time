<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)">
  <title>Time</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="anzeige" aria-live="polite">
      <p class="status" id="status">Noch nicht gestartet</p>
      <p class="gross" id="gross">7:42</p>
      <p class="beschriftung" id="beschriftung">noch offen</p>
      <p class="ende" id="ende"></p>
    </section>

    <section class="knoepfe" id="knoepfe"></section>

    <section class="summen">
      <div><span id="summe-arbeit">0:00</span><small>gearbeitet</small></div>
      <div><span id="summe-pause">0:00</span><small>Pause</small></div>
      <div><span id="summe-unterwegs">0:00</span><small>unterwegs</small></div>
    </section>

    <section class="heute">
      <h2>Heute</h2>
      <ol id="liste"></ol>
      <p class="leer" id="leer">Noch keine Einträge.</p>
      <button type="button" class="hinzufuegen" id="hinzufuegen">+ Eintrag nachtragen</button>
    </section>
  </main>

  <dialog id="dialog">
    <form method="dialog" id="formular">
      <h2 id="dialog-titel">Eintrag bearbeiten</h2>

      <fieldset class="arten">
        <legend>Art</legend>
        <label><input type="radio" name="typ" value="arbeit"><span>Arbeit</span></label>
        <label><input type="radio" name="typ" value="pause"><span>Pause</span></label>
        <label><input type="radio" name="typ" value="unterwegs"><span>Unterwegs</span></label>
      </fieldset>

      <div class="zeiten">
        <label>Beginn <input type="time" name="start" required></label>
        <label>Ende <input type="time" name="ende"></label>
      </div>
      <p class="hinweis">Ende leer lassen, wenn der Eintrag noch läuft.</p>
      <p class="fehler" id="fehler" role="alert"></p>

      <div class="aktionen">
        <button type="button" class="loeschen" id="loeschen">Löschen</button>
        <button type="button" id="abbrechen">Abbrechen</button>
        <button type="submit" class="speichern" value="speichern">Speichern</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/ui.js"></script>
</body>
</html>
